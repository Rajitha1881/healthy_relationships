name: PR Checks

# Trigger workflow on Pull Requests to main, pushes to main, or manual run
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Cancel in-flight runs for the same branch/PR when a new commit is pushed
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Code Linting & Static Analysis
  # ============================================================================
  lint:
    name: Code Linting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Lint with Ruff (Syntax errors, undefined names, unused imports)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          ruff check . --select=E9,F63,F7,F82

      - name: Style & Formatting Check
        run: |
          # Report warnings for PEP 8 styling conventions
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ============================================================================
  # Job 2: Automated Unit & Integration Tests (Matrix across Python versions)
  # ============================================================================
  test:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Test Suite
        run: |
          python -m unittest discover -v

  # ============================================================================
  # Job 3: PR Quality Gate (Required Status Check)
  # ============================================================================
  pr-gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Verify All Checks Passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ PR checks failed. Please fix the errors above before merging."
            exit 1
          fi
          echo "✅ All PR checks passed successfully!"

